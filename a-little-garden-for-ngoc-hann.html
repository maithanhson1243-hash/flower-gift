<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>A little Garden for Ngọc Hânn &lt;3</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@500;700&family=Lora:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet" />
<style>
  :root {
    --blush: #FBE4E6;
    --blush-deep: #F5C9D0;
    --rose: #E8899A;
    --berry: #8E3555;
    --cream: #FFF8EC;
    --ink: #4A2A3A;
    --night: #1E2240;
    --dusk: #3A2E5C;
    --horizon: #B86E86;
    --leaf: #6FA77A;
    --stem: #5E9B6B;
    --glow: #F6D58E;
    --intro-text: #7A3B4E;
    --btn-bg: #8E3555;
    --btn-text: #FFF8EC;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --blush: #3A2436;
      --blush-deep: #4D2D45;
      --intro-text: #F7DCE0;
      --btn-bg: #E8899A;
      --btn-text: #2B1525;
      color-scheme: dark;
    }
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: "Lora", Georgia, serif;
    background: var(--blush);
    -webkit-tap-highlight-color: transparent;
  }
  button { font: inherit; cursor: pointer; border: 0; background: none; color: inherit; }
  :focus-visible { outline: 2px dashed var(--glow); outline-offset: 4px; border-radius: 6px; }

  .screen {
    position: fixed; inset: 0;
    opacity: 0; visibility: hidden;
    transition: opacity 1.2s ease, visibility 0s linear 1.2s;
  }
  .screen.active { opacity: 1; visibility: visible; transition: opacity 1.2s ease; }

  /* ---------- Intro ---------- */
  #intro {
    background:
      radial-gradient(60vmax 60vmax at 50% 45%, var(--blush-deep), transparent 70%),
      var(--blush);
    display: grid; place-items: center;
    color: var(--intro-text);
    text-align: center;
    padding: 24px;
  }
  .intro-inner { display: flex; flex-direction: column; align-items: center; gap: 28px; }
  .whisper { font-style: italic; font-size: clamp(1.05rem, 3.6vw, 1.3rem); letter-spacing: .01em; }
  .made-for { font-family: "Dancing Script", cursive; font-size: clamp(1.5rem, 5.4vw, 2.1rem); line-height: 1.3; max-width: 22ch; }

  .gift { position: relative; width: 150px; height: 150px; margin-top: 10px; }
  .gift:not(.open) { animation: wiggle 3.6s ease-in-out infinite; }
  .box {
    position: absolute; bottom: 0; left: 0; width: 150px; height: 104px;
    border-radius: 6px 6px 10px 10px;
    background:
      linear-gradient(90deg, transparent 43%, #F7E2B5 43%, #F7E2B5 57%, transparent 57%),
      linear-gradient(180deg, #E8899A, #D9707F);
    box-shadow: 0 14px 30px -14px rgba(142, 53, 85, .55);
  }
  .lid {
    position: absolute; top: 20px; left: -8px; width: 166px; height: 34px;
    border-radius: 6px;
    background:
      linear-gradient(90deg, transparent 43%, #F7E2B5 43%, #F7E2B5 57%, transparent 57%),
      linear-gradient(180deg, #F2A1AF, #E8899A);
    transform-origin: 20% 100%;
    transition: transform 1s cubic-bezier(.3,1.4,.5,1), opacity .8s ease .5s;
    z-index: 2;
  }
  .bow { position: absolute; left: 50%; top: -24px; width: 0; height: 0; }
  .bow span {
    position: absolute; top: 0; width: 34px; height: 26px;
    border: 7px solid #F7E2B5; border-radius: 50%;
  }
  .bow span:first-child { right: 0; transform: rotate(-20deg); }
  .bow span:last-child { left: 0; transform: rotate(20deg); }
  .gift.open .lid { transform: translate(-30px, -90px) rotate(-28deg); opacity: 0; }

  @keyframes wiggle {
    0%, 70%, 100% { transform: rotate(0); }
    76% { transform: rotate(-4deg); }
    82% { transform: rotate(4deg); }
    88% { transform: rotate(-2deg); }
    94% { transform: rotate(1deg); }
  }

  .btn {
    background: var(--btn-bg); color: var(--btn-text);
    padding: 14px 30px; border-radius: 999px;
    font-size: 1.05rem; letter-spacing: .01em;
    box-shadow: 0 10px 24px -12px rgba(142, 53, 85, .7);
    transition: transform .2s ease;
  }
  .btn:active { transform: scale(.96); }

  /* ---------- Garden ---------- */
  #garden {
    background: linear-gradient(180deg, var(--night) 0%, var(--dusk) 52%, #6E4470 80%, var(--horizon) 100%);
    overflow: hidden;
  }
  #sky { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 0; }
  .moon {
    position: absolute; top: 7vh; right: 9vw; z-index: 1;
    width: clamp(48px, 11vw, 84px); aspect-ratio: 1; border-radius: 50%;
    background:
      radial-gradient(circle at 34% 40%, rgba(230, 214, 178, .7) 0 9%, transparent 10%),
      radial-gradient(circle at 62% 64%, rgba(230, 214, 178, .6) 0 6%, transparent 7%),
      radial-gradient(circle at 60% 30%, rgba(230, 214, 178, .5) 0 4%, transparent 5%),
      #FFF4D6;
    box-shadow: 0 0 40px 10px rgba(255, 240, 200, .35), 0 0 120px 40px rgba(255, 220, 200, .12);
  }

  @media (max-width: 600px) {
    .moon { top: 37vh; right: auto; left: 50%; margin-left: -22px; width: 44px; }
  }
  .hills { position: absolute; left: 0; bottom: 0; width: 100%; height: 30vh; z-index: 3; }

  .firefly {
    position: absolute; width: 4px; height: 4px; border-radius: 50%; z-index: 2;
    background: #FBEBB5;
    box-shadow: 0 0 8px 3px rgba(246, 213, 142, .7);
    animation: drift var(--d) ease-in-out infinite alternate, blink var(--b) ease-in-out infinite;
  }
  @keyframes drift { to { transform: translate(var(--dx), var(--dy)); } }
  @keyframes blink { 0%, 100% { opacity: .15; } 50% { opacity: 1; } }

  .deco { position: absolute; z-index: 4; transform-origin: bottom center; opacity: .5; }
  .deco svg { display: block; width: 100%; }

  .bfly {
    position: absolute; left: 0; top: var(--top); z-index: 7; width: 30px;
    animation: fly var(--dur) linear infinite; animation-delay: var(--delay);
    pointer-events: none;
  }
  .bfly .wl, .bfly .wr { transform-box: fill-box; animation: flap .32s ease-in-out infinite alternate; }
  .bfly .wl { transform-origin: right center; }
  .bfly .wr { transform-origin: left center; }
  @keyframes flap { to { transform: scaleX(.25); } }
  @keyframes fly {
    0% { transform: translate(-12vw, 0); }
    25% { transform: translate(24vw, -7vh); }
    50% { transform: translate(52vw, 3vh); }
    75% { transform: translate(82vw, -6vh); }
    100% { transform: translate(112vw, 0); }
  }

  .garden-head {
    position: absolute; top: max(5vh, 28px); left: 50%; transform: translateX(-50%);
    width: min(92vw, 640px); text-align: center; z-index: 6; color: #FCEFF2;
  }
  .garden-head h1 {
    font-family: "Dancing Script", cursive; font-weight: 700;
    font-size: clamp(2rem, 8vw, 3.6rem); line-height: 1.1;
    color: #FFE9EE;
    text-shadow: 0 0 18px rgba(255, 170, 190, .55), 0 0 2px rgba(255, 255, 255, .6);
  }
  .garden-head .date { margin-top: 14px; font-size: clamp(.95rem, 3.2vw, 1.1rem); letter-spacing: .02em; color: #F6D58E; }
  .garden-head .sub { margin-top: 6px; font-style: italic; font-size: clamp(.92rem, 3.1vw, 1.05rem); color: #EBD6E4; }
  .garden-head .counter { margin-top: 10px; font-size: .9rem; color: #EBD6E4; }
  .garden-head > * { opacity: 0; transform: translateY(8px); }
  #garden.active .garden-head > * { animation: rise 1s ease forwards; }
  #garden.active .garden-head > :nth-child(2) { animation-delay: .5s; }
  #garden.active .garden-head > :nth-child(3) { animation-delay: .8s; }
  #garden.active .garden-head > :nth-child(4) { animation-delay: 1.1s; }
  @keyframes rise { to { opacity: 1; transform: none; } }

  .hint {
    position: absolute; left: 0; right: 0; bottom: calc(env(safe-area-inset-bottom) + 10px);
    text-align: center; z-index: 6; font-style: italic; font-size: .92rem; color: #F6E6EE;
    text-shadow: 0 1px 6px rgba(0, 0, 0, .4); padding: 0 16px;
    transition: opacity .6s;
  }

  .flowers {
    position: absolute; left: 0; right: 0; bottom: calc(env(safe-area-inset-bottom) + 34px);
    display: flex; justify-content: center; align-items: flex-end;
    gap: clamp(2px, 2vw, 26px); z-index: 5;
  }
  .flower { width: min(17.5vw, 140px, 16vh); position: relative; }
  .flower svg { display: block; width: 100%; overflow: visible; transform-origin: bottom center; }
  #garden.active .flower svg { animation: growUp 1.6s cubic-bezier(.2,.9,.3,1) both, sway 5s ease-in-out 1.6s infinite alternate; }
  #garden.active .flower:nth-child(2) svg { animation-delay: .25s, 2s; }
  #garden.active .flower:nth-child(4) svg { animation-delay: .4s, 2.3s; }
  #garden.active .flower:nth-child(5) svg { animation-delay: .55s, 1.8s; }
  @keyframes growUp { from { transform: scaleY(0); opacity: 0; } to { transform: scaleY(1); opacity: 1; } }
  @keyframes sway { from { transform: rotate(-2deg); } to { transform: rotate(2deg); } }

  .flower .bud, .flower .bloom { transform-box: view-box; transition: transform 1s cubic-bezier(.3,1.5,.5,1), opacity .6s ease; }
  .flower .bloom { transform: scale(.15); opacity: 0; }
  .flower.open .bloom { transform: scale(1); opacity: 1; }
  .flower.open .bud { transform: scale(.4); opacity: 0; }
  .flower .halo { opacity: 0; transform-box: fill-box; transform-origin: center; }
  .flower:not(.open) .halo { animation: pulse 2.6s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { opacity: .15; transform: scale(.85); } 50% { opacity: .75; transform: scale(1.1); } }
  .flower.locked { visibility: hidden; }
  #garden.active .flower.locked svg { animation: none; }
  #garden.active .flower.grown svg { animation: growUp 1.8s cubic-bezier(.2,.9,.3,1) both, sway 5s ease-in-out 1.8s infinite alternate; }

  .mailbox {
    margin: 18px auto 0; display: flex; flex-direction: column; align-items: center; gap: 8px;
    color: #FFE9EE; font-style: italic; font-size: 1rem;
    animation: rise 1s ease forwards, float 3s ease-in-out 1s infinite alternate;
  }
  .mailbox[hidden] { display: none; }
  .mailbox svg { width: 64px; overflow: visible; filter: drop-shadow(0 0 14px rgba(246, 213, 142, .55)); }
  .mailbox .flap { transform-box: view-box; transform-origin: 32px 6px; transition: transform .7s ease; }
  .mailbox.opening .flap { transform: scaleY(-1); }
  @keyframes float { from { transform: translateY(0); } to { transform: translateY(-6px); } }

  /* ---------- Polaroid photos ---------- */
  .polaroid {
    position: absolute; z-index: 4;
    width: min(25vw, 15vh, 160px);
    background: #FFFDF8; padding: 6px 6px 0; border-radius: 2px;
    box-shadow: 0 12px 26px -10px rgba(0, 0, 0, .65);
    transform: rotate(var(--rot));
    opacity: 0; visibility: hidden;
  }
  .polaroid img { display: block; width: 100%; aspect-ratio: 3 / 4; object-fit: cover; background: #EADFD8; }
  .polaroid .cap {
    display: block; padding: 5px 2px 8px; text-align: center;
    font-family: "Dancing Script", cursive; font-size: clamp(.74rem, 2.7vw, 1.02rem); line-height: 1.15; color: #4A2A3A;
  }
  .p1 { left: 5vw; top: 31vh; --rot: -6deg; }
  .p3 { right: 5vw; top: 29vh; --rot: 5deg; }
  .p2 { left: 14vw; top: 52vh; --rot: -3deg; }
  .p4 { right: 14vw; top: 51vh; --rot: 4deg; }
  .polaroid.show { visibility: visible; }
  .p1.show { animation: bloomIn 1.8s ease forwards; }
  .p2.show { animation: placeDown 1.3s cubic-bezier(.2,.9,.3,1) forwards; }
  .p3.show { animation: bloomIn 1.4s ease .5s forwards; }
  .p4.show { animation: bloomIn 1.6s ease .9s forwards; }
  @keyframes bloomIn {
    from { opacity: 0; transform: rotate(var(--rot)) scale(.6); filter: blur(8px); }
    to { opacity: 1; transform: rotate(var(--rot)) scale(1); filter: blur(0); }
  }
  @keyframes placeDown {
    0% { opacity: 0; transform: translateY(46px) rotate(-14deg) scale(1.08); box-shadow: 0 30px 40px -10px rgba(0,0,0,.2); }
    70% { opacity: 1; }
    100% { opacity: 1; transform: rotate(var(--rot)); }
  }
  .p4 .light {
    position: absolute; left: 50%; top: 50%; width: 260%; aspect-ratio: 1; z-index: -1;
    transform: translate(-50%, -50%) scale(.2); border-radius: 50%; opacity: 0; pointer-events: none;
    background: radial-gradient(circle, rgba(255, 236, 190, .55), rgba(255, 190, 210, .18) 45%, transparent 70%);
  }
  .p4.show .light { animation: lightUp 2.4s ease forwards; }
  @keyframes lightUp { to { opacity: 1; transform: translate(-50%, -50%) scale(1); } }
  .p3 .baby { position: absolute; inset: -16px; width: calc(100% + 32px); height: calc(100% + 32px); pointer-events: none; overflow: visible; }

  .photo-view figure { width: min(100%, 26rem); background: #FFFDF8; padding: 12px 12px 18px; border-radius: 3px; box-shadow: 0 30px 70px -24px rgba(0,0,0,.7); animation: pop .5s cubic-bezier(.3,1.4,.5,1); text-align: center; }
  .photo-view img { display: block; width: 100%; max-height: 64vh; object-fit: cover; aspect-ratio: 3 / 4; }
  .photo-view h2 { margin-top: 12px; font-family: "Dancing Script", cursive; font-size: 1.8rem; color: var(--berry); line-height: 1.1; }
  .photo-view p { margin-top: 4px; font-style: italic; color: var(--ink); }
  .photo-view .ghost-btn { margin-top: 14px; }

  /* ---------- Overlays ---------- */
  .overlay {
    position: fixed; inset: 0; z-index: 20;
    display: grid; place-items: center; padding: 20px;
    background: rgba(20, 16, 40, .55);
    backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px);
    animation: fadeIn .4s ease;
  }
  .overlay[hidden] { display: none; }
  @keyframes fadeIn { from { opacity: 0; } }

  .note-card {
    width: min(100%, 34rem); max-height: 82vh; overflow-y: auto;
    background: var(--cream); color: var(--ink);
    border-radius: 20px 20px 20px 6px;
    padding: 28px 26px 22px;
    box-shadow: 0 24px 60px -20px rgba(0, 0, 0, .55);
    animation: pop .5s cubic-bezier(.3,1.4,.5,1);
  }
  @keyframes pop { from { transform: scale(.85) translateY(20px); opacity: 0; } }
  .note-title { font-family: "Dancing Script", cursive; font-size: 1.9rem; color: var(--berry); line-height: 1.1; }
  .note-text { margin-top: 14px; font-size: 1.05rem; line-height: 1.75; white-space: pre-line; min-height: 3em; }
  .caret::after { content: ""; display: inline-block; width: 1px; height: 1.1em; margin-left: 2px; vertical-align: -.15em; background: var(--berry); animation: caret .8s steps(1) infinite; }
  @keyframes caret { 50% { opacity: 0; } }
  .note-foot { margin-top: 20px; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .note-foot small { font-style: italic; color: #8A6A78; font-size: .85rem; }
  .ghost-btn { padding: 10px 22px; border-radius: 999px; background: var(--berry); color: var(--cream); font-size: .95rem; }

  .letter {
    position: relative;
    width: min(100%, 36rem); max-height: 86vh; overflow-y: auto;
    background:
      repeating-linear-gradient(180deg, transparent 0 31px, rgba(200, 150, 160, .22) 31px 32px),
      #FFF8EC;
    color: var(--ink);
    padding: 44px 30px 34px;
    border-radius: 4px;
    box-shadow: 0 30px 70px -24px rgba(0, 0, 0, .6);
    transform-origin: top center;
    animation: unfold 1.1s cubic-bezier(.2,.8,.3,1);
  }
  @keyframes unfold { from { transform: perspective(900px) rotateX(-80deg) scaleY(.4); opacity: 0; } }
  .corner { position: absolute; width: 58px; pointer-events: none; }
  .corner.tl { top: 8px; left: 8px; }
  .corner.br { bottom: 8px; right: 8px; transform: rotate(180deg); }
  .letter .greet { font-family: "Dancing Script", cursive; font-size: 1.9rem; color: var(--berry); }
  .letter .body { margin-top: 10px; font-size: 1.04rem; line-height: 2; white-space: pre-line; }
  .letter .closing { margin-top: 18px; font-family: "Dancing Script", cursive; font-size: 1.6rem; color: var(--berry); opacity: 0; transition: opacity 1.2s; }
  .letter .sign { margin-top: 6px; text-align: right; font-family: "Dancing Script", cursive; font-size: 1.35rem; opacity: 0; transition: opacity 1.2s .6s; }
  .letter.done .closing, .letter.done .sign { opacity: 1; }
  .letter .close-row { margin-top: 26px; text-align: center; opacity: 0; transition: opacity 1s 1.2s; }
  .letter.done .close-row { opacity: 1; }

  #petals { position: fixed; inset: 0; pointer-events: none; z-index: 30; }
  .petal {
    position: absolute; width: 12px; height: 12px;
    border-radius: 80% 0 80% 0;
    animation: petalFly var(--t) cubic-bezier(.15,.7,.4,1) forwards;
  }
  @keyframes petalFly {
    0% { transform: translate(0, 0) rotate(0); opacity: 1; }
    100% { transform: translate(var(--dx), var(--dy)) rotate(var(--r)); opacity: 0; }
  }

  #musicBtn {
    position: fixed; top: calc(env(safe-area-inset-top) + 12px); left: 12px; z-index: 40;
    padding: 8px 14px; border-radius: 999px; font-size: .85rem;
    background: rgba(255, 248, 236, .16); color: #FFE9EE;
    border: 1px solid rgba(255, 233, 238, .35);
  }
  #musicBtn[hidden] { display: none; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .2s !important; }
    .bfly, .firefly { display: none; }
  }
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <radialGradient id="halo">
      <stop offset="0" stop-color="#FFE7A8" stop-opacity=".9" />
      <stop offset="1" stop-color="#FFB7C5" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="g-stem" x1="0" x2="1"><stop offset="0" stop-color="#3F7A50"/><stop offset=".5" stop-color="#86BF8F"/><stop offset="1" stop-color="#3F7A50"/></linearGradient>
    <linearGradient id="g-leaf" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#A3D6AB"/><stop offset=".5" stop-color="#5E9B6B"/><stop offset="1" stop-color="#335F41"/></linearGradient>
    <linearGradient id="g-branch" x1="0" x2="1"><stop offset="0" stop-color="#4A3226"/><stop offset=".5" stop-color="#7D5A47"/><stop offset="1" stop-color="#4A3226"/></linearGradient>
    <linearGradient id="g-tulip-back" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F27BA0"/><stop offset="1" stop-color="#A9325A"/></linearGradient>
    <linearGradient id="g-tulip-front" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFD9E4"/><stop offset=".4" stop-color="#F592B3"/><stop offset="1" stop-color="#C9416E"/></linearGradient>
    <radialGradient id="g-rose-out" cx=".5" cy=".3" r=".85"><stop offset="0" stop-color="#EC6479"/><stop offset=".65" stop-color="#A3253F"/><stop offset="1" stop-color="#6A1428"/></radialGradient>
    <radialGradient id="g-rose-in" cx=".5" cy=".7" r=".75"><stop offset="0" stop-color="#F7909F"/><stop offset=".6" stop-color="#CC3E58"/><stop offset="1" stop-color="#8A1E36"/></radialGradient>
    <linearGradient id="g-sun-petal" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#E0870C"/><stop offset=".45" stop-color="#FFC93C"/><stop offset="1" stop-color="#FFE68A"/></linearGradient>
    <linearGradient id="g-sun-back" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#B86A08"/><stop offset="1" stop-color="#EBA82A"/></linearGradient>
    <radialGradient id="g-sun-core"><stop offset="0" stop-color="#2A170A"/><stop offset=".55" stop-color="#4A2A14"/><stop offset=".85" stop-color="#734520"/><stop offset="1" stop-color="#9C6A2E"/></radialGradient>
    <radialGradient id="g-sakura" cx=".5" cy="1" r="1.1"><stop offset="0" stop-color="#EE7398"/><stop offset=".35" stop-color="#F8BFD0"/><stop offset=".85" stop-color="#FFF2F6"/></radialGradient>
    <linearGradient id="g-wrap" x1="0" x2="1"><stop offset="0" stop-color="#E2C7AC"/><stop offset=".45" stop-color="#FBEFE2"/><stop offset="1" stop-color="#D6B797"/></linearGradient>
    <linearGradient id="g-ribbon" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F7A6B6"/><stop offset="1" stop-color="#D45C78"/></linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="1.5" stdDeviation="1.4" flood-color="#141030" flood-opacity=".4"/></filter>
  </defs>
</svg>

<button id="musicBtn" hidden aria-pressed="true">♪ Tắt nhạc</button>

<!-- Screen 1 -->
<section id="intro" class="screen active" aria-label="Món quà">
  <div class="intro-inner">
    <p class="whisper">🌷 I have something for you…</p>
    <div class="gift" id="gift" aria-hidden="true">
      <div class="lid"><div class="bow"><span></span><span></span></div></div>
      <div class="box"></div>
    </div>
    <p class="made-for">This little garden was made just for Ngọc Hânn.</p>
    <button class="btn" id="openBtn">Open your little gift ♡</button>
  </div>
</section>

<!-- Screen 2 -->
<section id="garden" class="screen" aria-label="Khu vườn">

/* ==========================================================
   Starry sky
   ========================================================== */
const sky = $("#sky"), sctx = sky.getContext("2d");
let stars = [];
function sizeSky() {
  const dpr = Math.min(devicePixelRatio || 1, 2);
  sky.width = innerWidth * dpr; sky.height = innerHeight * dpr;
  sctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const n = Math.round(innerWidth * innerHeight / 6000);
  stars = Array.from({ length: n }, () => ({
    x: Math.random() * innerWidth, y: Math.random() * innerHeight * .7,
    r: Math.random() * 1.3 + .3, p: Math.random() * Math.PI * 2, s: .6 + Math.random() * 1.4
  }));
}
function drawSky(t) {
  sctx.clearRect(0, 0, innerWidth, innerHeight);
  for (const st of stars) {
    const a = reduced ? .7 : .35 + .65 * (0.5 + 0.5 * Math.sin(st.p + t / 1000 * st.s));
    sctx.globalAlpha = a; sctx.fillStyle = "#FFF6E0";
    sctx.beginPath(); sctx.arc(st.x, st.y, st.r, 0, Math.PI * 2); sctx.fill();
  }
  if (!reduced && $("#garden").classList.contains("active")) requestAnimationFrame(drawSky);
}
addEventListener("resize", () => { sizeSky(); if (reduced) drawSky(0); });

/* ==========================================================
   Soft piano (Web Audio)
   ========================================================== */
const music = { ctx: null, on: false, timer: null, next: 0, step: 0 };
const PROG = [[60, 64, 67, 71], [57, 60, 64, 67], [53, 57, 60, 64], [55, 59, 62, 67]];
const PATTERN = [0, 1, 2, 3, 2, 1, 2, 3];
const STEP = 0.42;
function startMusic() {
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    const ctx = music.ctx = new AC();
    const lp = ctx.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 2400;
    const master = ctx.createGain(); master.gain.value = 0.22;
    const delay = ctx.createDelay(); delay.delayTime.value = 0.36;
    const fb = ctx.createGain(); fb.gain.value = 0.32;
    const wet = ctx.createGain(); wet.gain.value = 0.28;
    master.connect(lp); lp.connect(ctx.destination);
    lp.connect(delay); delay.connect(fb); fb.connect(delay); delay.connect(wet); wet.connect(ctx.destination);
    music.out = master; music.next = ctx.currentTime + 0.1; music.on = true;
    music.timer = setInterval(schedule, 90);
    $("#musicBtn").hidden = false;
  } catch (e) { /* audio not available */ }
}
function note(midi, t, vel, dur) {
  const ctx = music.ctx, f = 440 * Math.pow(2, (midi - 69) / 12);
  const g = ctx.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vel, t + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  const o1 = ctx.createOscillator(); o1.type = "sine"; o1.frequency.value = f;
  const o2 = ctx.createOscillator(); o2.type = "triangle"; o2.frequency.value = f * 2;
  const g2 = ctx.createGain(); g2.gain.value = 0.12;
  o1.connect(g); o2.connect(g2); g2.connect(g); g.connect(music.out);
  o1.start(t); o2.start(t); o1.stop(t + dur + 0.05); o2.stop(t + dur + 0.05);
}
function schedule() {
  const ctx = music.ctx;
  while (music.next < ctx.currentTime + 0.5) {
    const bar = Math.floor(music.step / 8) % PROG.length, i = music.step % 8;
    const chord = PROG[bar], t = music.next;
    if (i === 0) note(chord[0] - 12, t, 0.5, 3.2);
    note(chord[PATTERN[i]], t, 0.28, 1.6);
    if ((i === 0 || i === 5) && Math.floor(music.step / 8) % 2 === 1) note(chord[(i === 0 ? 3 : 2)] + 12, t + 0.02, 0.18, 2.2);
    music.next += STEP; music.step++;
  }
}
$("#musicBtn").addEventListener("click", async e => {
  if (!music.ctx) return;
  if (music.on) { await music.ctx.suspend(); music.on = false; }
  else { await music.ctx.resume(); music.on = true; }
  e.currentTarget.textContent = music.on ? "♪ Tắt nhạc" : "♪ Bật nhạc";
  e.currentTarget.setAttribute("aria-pressed", String(music.on));
});

/* ==========================================================
   Helpers
   ========================================================== */
function burst(x, y, n = 26, colors = ["#F9C6D3", "#F4A8BA", "#EE7C9C", "#FFF3E2", "#F6D58E"]) {
  if (reduced) return;
  const layer = $("#petals");
  for (let i = 0; i < n; i++) {
    const p = document.createElement("span");
    p.className = "petal";
    const ang = -Math.PI / 2 + (Math.random() - .5) * Math.PI * 1.3;
    const dist = 80 + Math.random() * 220;
    p.style.cssText = `left:${x}px;top:${y}px;background:${colors[i % colors.length]};--dx:${Math.cos(ang) * dist}px;--dy:${Math.sin(ang) * dist + 60}px;--r:${(Math.random() - .5) * 720}deg;--t:${1.4 + Math.random() * 1.2}s;width:${8 + Math.random() * 8}px;height:${8 + Math.random() * 8}px;`;
    layer.appendChild(p);
    setTimeout(() => p.remove(), 2800);
  }
}

let typing = null;
function typeInto(el, text, speed, done) {
  if (typing) typing.finish(false);
  el.textContent = "";
  el.classList.add("caret");
  const chars = Array.from(text);
  let i = 0, id = null, finished = false;
  const finish = (call = true) => {
    if (finished) return; finished = true;
    clearTimeout(id); el.textContent = text; el.classList.remove("caret");
    typing = null; if (call && done) done();
  };
  const tick = () => {
    i++; el.textContent = chars.slice(0, i).join("");
    if (i >= chars.length) return finish();
    const c = chars[i - 1];
    id = setTimeout(tick, /[.!?…]/.test(c) ? speed * 9 : c === "," ? speed * 4 : c === "\n" ? speed * 3 : speed);
  };
  typing = { finish };
  if (reduced) finish(); else id = setTimeout(tick, 250);
  return typing;
}

/* ==========================================================
   Flow
   ========================================================== */
$("#openBtn").addEventListener("click", e => {
  e.currentTarget.disabled = true;
  startMusic();
  $("#gift").classList.add("open");
  const r = $("#gift").getBoundingClientRect();
  setTimeout(() => burst(r.left + r.width / 2, r.top + 40, 46), 300);
  setTimeout(() => {
    $("#intro").classList.remove("active");
    $("#garden").classList.add("active");
    sizeSky(); requestAnimationFrame(drawSky);
    document.querySelectorAll(".deco").forEach(d => {
      d.animate([{ transform: "scaleY(0)", opacity: 0 }, { transform: "scaleY(1)", opacity: .5 }],
        { duration: reduced ? 1 : 1400, delay: reduced ? 0 : d.dataset.delay * 1000, easing: "cubic-bezier(.2,.9,.3,1)", fill: "backwards" });
    });
    updateHint();
  }, reduced ? 200 : 1500);
});

const hint = $("#hint");
function updateHint() {
  const regular = FLOWERS.filter(f => !f.locked).length;
  const n = [...state.opened].filter(id => id !== "bouquet").length;
  if (n < regular) hint.textContent = n === 0 ? "Chạm vào từng nụ hoa nhé, mỗi bông đang giữ một lời nhắn cho em." : `Còn ${regular - n} nụ hoa đang chờ em chạm vào.`;
  else if (!state.opened.has("bouquet")) hint.textContent = "Có một bó hoa vừa xuất hiện giữa khu vườn…";
  else hint.textContent = "";
}

let currentFlower = null;
function onFlower(f, btn) {
  currentFlower = f;
  const first = !btn.classList.contains("open");
  if (first) {
    btn.classList.add("open");
    state.opened.add(f.id);
    const r = btn.getBoundingClientRect();
    burst(r.left + r.width / 2, r.top + r.height * .3, 22);
  }
  setTimeout(() => showNote(f), first && !reduced ? 750 : 0);
}

function showNote(f) {
  let text = f.text;
  if (f.random) {
    let k; do { k = Math.floor(Math.random() * SUNFLOWER_WISHES.length); } while (k === state.lastWish && SUNFLOWER_WISHES.length > 1);
    state.lastWish = k; text = SUNFLOWER_WISHES[k];
  }
  $("#noteTitle").textContent = f.title;
  const hintEl = $("#noteHint");
  hintEl.textContent = "Chạm vào chữ để hiện hết lời nhắn";
  $("#note").hidden = false;
  $("#noteClose").focus();
  typeInto($("#noteText"), text, f.id === "bouquet" ? 30 : 38, () => {
    hintEl.textContent = f.random ? "Chạm lại bông hoa để nhận một lời chúc khác" : "";
  });
}
$("#noteText").addEventListener("click", () => typing && typing.finish());

function closeNote() {
  if ($("#note").hidden) return;
  if (typing) typing.finish(false);
  $("#note").hidden = true;
  const regularDone = FLOWERS.filter(f => !f.locked).every(f => state.opened.has(f.id));
  if (regularDone && !state.bouquetUnlocked) {
    state.bouquetUnlocked = true;
    const b = document.querySelector('[data-id="bouquet"]');
    setTimeout(() => {
      b.classList.remove("locked"); b.classList.add("grown");
      b.removeAttribute("aria-hidden"); b.tabIndex = 0;
      const r = b.getBoundingClientRect();
      burst(r.left + r.width / 2, r.top + r.height * .4, 30, ["#F6D58E", "#FFF3E2", "#F9C6D3"]);
    }, 400);
  }
  if (currentFlower && currentFlower.id === "bouquet" && $("#mailbox").hidden) {
    setTimeout(() => { $("#mailbox").hidden = false; }, 3200);
  }
  updateHint();
  revealPhotos();
}
$("#noteClose").addEventListener("click", closeNote);
$("#note").addEventListener("click", e => { if (e.target.id === "note") closeNote(); });

/* ==========================================================
   Photos
   ========================================================== */
const PHOTO_TITLES = ["The First Bloom", "A Little Smile", "My Favorite View", "The Last Flower"];
const photoEls = [...document.querySelectorAll(".polaroid")];
function showPhoto(i) {
  const el = photoEls[i];
  if (!el || el.classList.contains("show")) return;
  if (i === 2) {
    const r = el.getBoundingClientRect();
    burst(0, r.top + r.height / 2, 14, ["#FFF8EC", "#F9C6D3", "#FFFFFF"]);
    burst(innerWidth, r.top, 14, ["#FFF8EC", "#F9C6D3", "#FFFFFF"]);
    burst(r.left + r.width / 2, r.top + r.height / 2, 20, ["#FFF8EC", "#F9C6D3", "#F4A8BA"]);
  }
  el.classList.add("show");
  el.tabIndex = 0;
  if (i === 0) {
    hint.textContent = "Một tấm ảnh vừa xuất hiện, chạm vào để xem lớn hơn.";
    setTimeout(updateHint, 4500);
  }
}
function revealPhotos() {
  const n = FLOWERS.filter(f => !f.locked && state.opened.has(f.id)).length;
  for (let i = 0; i < Math.min(n, 3); i++) setTimeout(() => showPhoto(i), 500);
  if (state.opened.has("bouquet")) setTimeout(() => showPhoto(3), 400);
}
photoEls.forEach(el => el.addEventListener("click", () => {
  const i = +el.dataset.i;
  $("#photoImg").src = el.querySelector("img").src;
  $("#photoImg").alt = el.querySelector("img").alt;
  $("#photoTitle").textContent = PHOTO_TITLES[i];
  $("#photoCap").textContent = el.querySelector(".cap").textContent;
  $("#photoView").hidden = false;
  $("#photoClose").focus();
}));
function closePhoto() { $("#photoView").hidden = true; }
$("#photoClose").addEventListener("click", closePhoto);
$("#photoView").addEventListener("click", e => { if (e.target.id === "photoView") closePhoto(); });
addEventListener("keydown", e => { if (e.key === "Escape") closePhoto(); });

// Letter
$("#mailbox").addEventListener("click", e => {
  const mb = e.currentTarget;
  mb.classList.add("opening");
  setTimeout(openLetter, reduced ? 0 : 800);
});
function openLetter() {
  const wrap = $("#letterWrap"), letter = $("#letter");
  letter.classList.remove("done");
  $("#letterGreet").textContent = LETTER.greet;
  $("#letterSign").textContent = CONFIG.signature;
  const paras = [...LETTER.body];
  if (CONFIG.secretLine) paras.push(CONFIG.secretLine);
  wrap.hidden = false;
  letter.scrollTop = 0;
  $("#letterClose").focus({ preventScroll: true });
  setTimeout(() => {
    typeInto($("#letterBody"), paras.join("\n\n"), 34, () => {
      letter.classList.add("done");
      const r = letter.getBoundingClientRect();
      setTimeout(() => burst(r.left + r.width / 2, r.bottom - 60, 36), 900);
    });
  }, reduced ? 0 : 900);
}
$("#letterBody").addEventListener("click", () => typing && typing.finish());
function closeLetter() {
  if ($("#letterWrap").hidden) return;
  if (typing) typing.finish(false);
  $("#letter").classList.add("done");
  $("#letterWrap").hidden = true;
  $("#mailbox").classList.remove("opening");
}
$("#letterClose").addEventListener("click", closeLetter);
$("#letterWrap").addEventListener("click", e => { if (e.target.id === "letterWrap") closeLetter(); });

addEventListener("keydown", e => { if (e.key === "Escape") { closeNote(); closeLetter(); } });
</script>
